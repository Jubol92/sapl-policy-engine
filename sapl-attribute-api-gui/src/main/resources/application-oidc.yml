# Activate with --spring.profiles.active=oidc (plus KEYCLOAK_CLIENT_SECRET)
# to enable the "Login with Keycloak" button on the Settings view. Matches
# the businessA/sapl confidential client already set up in sapl-k8s for
# testing sapl-attribute-api's OAuth2 auth.
spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:sapl}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.sapl.local:30080/realms/businessA}
